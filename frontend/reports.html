<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports - Smart Attendance</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar" style="display:none;"></nav>

  <div class="dash">
    <aside class="sidebar" id="reportsSidebar"></aside>

    <main class="dash-main">
      <header class="page-header">
        <div>
          <h1>Attendance Reports</h1>
          <p class="sub">Filters: date, department, year, section, subject, teacher, student.</p>
        </div>
      </header>

      <div class="card">
        <div class="toolbar" id="reportFilters">
          <input type="date" id="fDate" class="form-control" title="Date" />
          <select id="fDepartment" class="form-control" title="Department"><option value="">All Depts</option></select>
          <select id="fYear" class="form-control" title="Year"><option value="">All Years</option></select>
          <select id="fSection" class="form-control" title="Section"><option value="">All Sections</option></select>
          <select id="fSubject" class="form-control" title="Subject"><option value="">All Subjects</option></select>
          <button class="btn btn-sm" id="generateBtn">Generate</button>
          <button class="btn btn-sm btn-outline" id="exportBtn">Export CSV</button>
        </div>

        <div class="stat-grid mt-16">
          <div class="stat-card"><div><div class="stat-value" id="rTotal">0</div><div class="stat-label">Total Records</div></div></div>
          <div class="stat-card"><div><div class="stat-value" id="rPresent">0</div><div class="stat-label">Present</div></div></div>
          <div class="stat-card"><div><div class="stat-value" id="rAbsent">0</div><div class="stat-label">Absent</div></div></div>
          <div class="stat-card"><div><div class="stat-value" id="rRejected">0</div><div class="stat-label">Rejected</div></div></div>
        </div>

        <div class="table-wrap" id="reportWrap">
          <table>
            <thead><tr><th>Student</th><th>Date</th><th>Subject</th><th>Status</th><th>Room</th><th>Expected</th><th>Reason / Checks</th></tr></thead>
            <tbody id="reportBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/timetable.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
